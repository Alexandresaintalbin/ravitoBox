name: ravitobox

networks:
  ravito:
    name: ravitobox

volumes:
  db_data:

x-health-defaults: &health
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 20s

services:
  db:
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    networks: [ravito]
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-54322}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db-entrypoint.sh:/db-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/db-entrypoint.sh"]
    command: ["postgres", "-D", "/etc/postgresql"]
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "test -f /tmp/roles-ready && pg_isready -U postgres -d postgres"]

  auth:
    image: supabase/gotrue:v2.177.0
    restart: unless-stopped
    networks: [ravito]
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}?sslmode=disable
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-true}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-true}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      # Vides : Mailpit n'a pas de TLS. GoTrue refuse sinon d'envoyer un mot de passe SMTP en clair.
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]

  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    networks: [ravito]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}?sslmode=disable
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: public

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    networks: [ravito]
    ports:
      - "${KONG_HTTP_PORT:-8000}:8000"
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      - ./docker/kong.yml:/home/kong/temp.yml:ro
    entrypoint: ["bash", "-c", "sed -e \"s|__ANON_KEY__|$${SUPABASE_ANON_KEY}|g\" -e \"s|__SERVICE_KEY__|$${SUPABASE_SERVICE_KEY}|g\" /home/kong/temp.yml > /home/kong/kong.yml && /docker-entrypoint.sh kong docker-start"]
    healthcheck:
      <<: *health
      test: ["CMD", "kong", "health"]

  meta:
    image: supabase/postgres-meta:v0.89.3
    restart: unless-stopped
    networks: [ravito]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  studio:
    image: supabase/studio:2025.06.30-sha-6f5982d
    restart: unless-stopped
    networks: [ravito]
    ports:
      - "127.0.0.1:${STUDIO_PORT:-54323}:3000"
    depends_on:
      meta:
        condition: service_started
      kong:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_ENABLE_LOGS: "false"
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    networks: [ravito]
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  migrate:
    image: postgres:15-alpine
    networks: [ravito]
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: supabase_admin
      PGDATABASE: ${POSTGRES_DB:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SIGNUP_MODE: ${SIGNUP_MODE:-closed}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-true}
      ENABLE_EMAIL_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./supabase/seed.sql:/seed.sql:ro
      - ./docker/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    restart: "no"

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    networks: [ravito]
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
    depends_on:
      kong:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *health
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]

  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    networks: [ravito]
    ports:
      - "5173:5173"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./public:/app/public
    depends_on:
      kong:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    networks: [ravito]
    volumes:
      - ./coverage:/app/coverage

  integration:
    profiles: ["integration"]
    build:
      context: .
      target: test
    networks: [ravito]
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    command: ["npm", "run", "test:integration"]
    depends_on:
      kong:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  e2e:
    profiles: ["e2e"]
    build:
      context: .
      target: e2e
    networks: [ravito]
    environment:
      BASE_URL: http://web:8080
      AUTH_URL: http://kong:8000
      MAILPIT_URL: http://mailpit:8025
      CI: "1"
    depends_on:
      web:
        condition: service_healthy
      mailpit:
        condition: service_started
